<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rough cut — selection workbench</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; overflow: hidden; background: #111; color: #eee; font: 14px/1.45 -apple-system, sans-serif; }
    .layout { display: grid; grid-template-columns: 48% 52%; height: 100vh; }
    .left { position: sticky; top: 0; align-self: start; padding: 14px 16px; background: #0d0d0d; border-right: 1px solid #2a2a2a; }
    video { width: 100%; max-height: 48vh; background: #000; border-radius: 8px; }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .stat, .meta { color: #888; font-size: 12px; }
    .clipname { display: inline-block; max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
    #save { min-width: 90px; color: #7c7; font-size: 12px; }
    .right { height: 100vh; overflow-y: auto; padding: 14px 16px 80px; }
    .scene { margin: 18px 0 6px; }
    .scene h2 { margin: 0; color: #9cf; font-size: 16px; }
    .snote { margin: 2px 0 0; color: #c9a84c; font-size: 12px; }
    .row { display: flex; gap: 10px; margin: 8px 0; padding: 8px; background: #1b1b1b; border: 1px solid #333; border-radius: 8px; }
    .row.use { background: #17251a; border-color: #2e7d32; }
    .row.maybe { background: #221f14; border-color: #b8860b; }
    .row.reject { background: #201313; border-color: #8b1c1c; opacity: .55; }
    .txt { flex: 1; }
    .gnote { color: #8fa; font-size: 12px; }
    .mnote { display: block; width: 100%; margin-top: 6px; padding: 4px 6px; background: #111; color: #eee; border: 1px solid #444; border-radius: 4px; font: 12px/1.4 inherit; resize: vertical; }
    .rate { padding: 0 5px; background: #333; border-radius: 4px; font-size: 11px; }
    .r5 { background: #1b5e20; } .r4 { background: #33691e; } .r3 { background: #4e4a1c; } .r2 { background: #5d4037; }
    button { border: 0; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .play { padding: 8px 12px; background: #2e5d8a; color: #fff; }
    .mk { margin-right: 4px; padding: 6px 8px; background: #333; color: #ccc; }
    .mk.on { background: #2e7d32; color: #fff; } .mk.maybe.on { background: #b8860b; } .mk.reject { margin-right: 0; } .mk.reject.on { background: #b71c1c; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="left">
      <header><b>Selection workbench</b> — Mark what you want to use. Notes are saved automatically.</header>
      <video id="video" controls playsinline preload="metadata"></video>
      <div class="controls">
        <button class="play" id="stop">■ Stop</button>
        <label class="stat"><input type="checkbox" id="only-marked"> only marked</label>
        <span class="stat" id="now"></span>
        <span id="save"></span>
      </div>
      <div class="stat" id="counts" style="margin-top: 8px"></div>
    </div>
    <div class="right" id="list"><div class="stat">loading…</div></div>
  </div>
  <script>
    let candidates = [];
    let selections = { marks: {} };
    let currentEnd = null;
    let saveTimer = null;
    const video = document.getElementById('video');

    function candidateId(candidate) { return `${candidate.clip}|${Number(candidate.start).toFixed(4)}`; }
    function escapeHtml(value) { return (value || '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char])); }

    async function loadWorkbench() {
      const [candidateResponse, selectionResponse] = await Promise.all([fetch('/api/candidates'), fetch('/api/selections')]);
      if (!candidateResponse.ok) {
        const error = await candidateResponse.json().catch(() => ({}));
        document.getElementById('list').innerHTML = `<div class="stat">${escapeHtml(error.error || 'Could not load candidates.')}</div>`;
        return;
      }
      candidates = await candidateResponse.json();
      selections = selectionResponse.ok ? await selectionResponse.json() : { marks: {} };
      selections.marks = selections.marks || {};
      renderCandidates();
    }

    function renderCandidates() {
      const onlyMarked = document.getElementById('only-marked').checked;
      let markup = '';
      for (const section of candidates) {
        const visible = section.candidates.filter(candidate => !onlyMarked || selections.marks[candidateId(candidate)]?.state);
        if (onlyMarked && !visible.length) continue;
        markup += `<div class="scene"><h2>${escapeHtml(section.label)}</h2>${section.note ? `<div class="snote">${escapeHtml(section.note)}</div>` : ''}</div>`;
        for (const candidate of visible) markup += candidateMarkup(candidate);
      }
      document.getElementById('list').innerHTML = markup || '<div class="stat">no candidates</div>';
      updateCounts();
    }

    function candidateMarkup(candidate) {
      const id = candidateId(candidate);
      const mark = selections.marks[id] || {};
      const state = mark.state || '';
      const stars = '★'.repeat(candidate.rating || 0) || '·';
      return `<div class="row ${state}" data-id="${escapeHtml(id)}"><div class="txt"><span class="rate r${candidate.rating || 0}">${stars}</span> <span class="meta"><span class="clipname" title="${escapeHtml(candidate.clip)}">${escapeHtml(candidate.clip)}</span> · ${candidate.start.toFixed(0)}–${candidate.end.toFixed(0)}s</span> ${state === 'maybe' ? '<span class="meta">MAYBE</span>' : ''}<div>${escapeHtml(candidate.text)}</div>${candidate.note ? `<div class="gnote">AI note: ${escapeHtml(candidate.note)}</div>` : ''}${mark.note ? `<div class="gnote" style="color:#c9a84c">me: ${escapeHtml(mark.note)}</div>` : ''}<textarea class="mnote" rows="1" placeholder="note…" data-id="${escapeHtml(id)}">${escapeHtml(mark.note || '')}</textarea></div><div><button class="play" data-play="${escapeHtml(id)}">▶</button><br><button class="mk use ${state === 'use' ? 'on' : ''}" data-mark="use" data-id="${escapeHtml(id)}">✓</button><button class="mk maybe ${state === 'maybe' ? 'on' : ''}" data-mark="maybe" data-id="${escapeHtml(id)}">★</button><button class="mk reject ${state === 'reject' ? 'on' : ''}" data-mark="reject" data-id="${escapeHtml(id)}">✕</button></div></div>`;
    }

    function findCandidate(id) { return candidates.flatMap(section => section.candidates).find(candidate => candidateId(candidate) === id); }
    function updateCounts() {
      const marks = Object.values(selections.marks);
      document.getElementById('counts').textContent = `${marks.filter(mark => mark.state === 'use').length} use / ${marks.filter(mark => mark.state === 'maybe').length} maybe / ${marks.filter(mark => mark.state === 'reject').length} reject / ${marks.filter(mark => mark.note).length} notes`;
    }
    function toggleMark(id, state) {
      const mark = selections.marks[id] || {};
      mark.state = mark.state === state ? '' : state;
      selections.marks[id] = mark;
      renderCandidates();
      saveSelections();
    }
    function saveSelections() {
      fetch('/api/selections', { method: 'POST', body: JSON.stringify(selections) })
        .then(response => { if (!response.ok) throw new Error('Save failed'); return response.json(); })
        .then(result => { const save = document.getElementById('save'); save.textContent = `saved ${result.saved}`; save.style.color = '#7c7'; })
        .catch(() => { const save = document.getElementById('save'); save.textContent = 'SAVE FAILED'; save.style.color = '#f66'; });
    }
    function stopPlayback() {
      currentEnd = null;
      video.pause();
      document.getElementById('now').textContent = '';
      document.querySelectorAll('.row').forEach(row => row.style.outline = '');
    }
    function playCandidate(candidate) {
      currentEnd = candidate.end + 0.6;
      const id = candidateId(candidate);
      document.querySelectorAll('.row').forEach(row => row.style.outline = row.dataset.id === id ? '2px solid #9cf' : '');
      document.getElementById('now').textContent = `${candidate.clip} · ${candidate.start.toFixed(1)}s`;
      const source = `media/${candidate.clip}.mp4`;
      const startVideo = () => { video.currentTime = candidate.start; video.play(); };
      if (video.dataset.source !== source) { video.dataset.source = source; video.src = source; video.load(); video.addEventListener('loadedmetadata', startVideo, { once: true }); } else startVideo();
    }

    document.getElementById('stop').addEventListener('click', stopPlayback);
    document.getElementById('only-marked').addEventListener('change', renderCandidates);
    document.getElementById('list').addEventListener('click', event => { const button = event.target.closest('button'); if (!button) return; if (button.dataset.mark) toggleMark(button.dataset.id, button.dataset.mark); if (button.dataset.play) playCandidate(findCandidate(button.dataset.play)); });
    document.getElementById('list').addEventListener('input', event => { if (!event.target.classList.contains('mnote')) return; const mark = selections.marks[event.target.dataset.id] || (selections.marks[event.target.dataset.id] = {}); mark.note = event.target.value; clearTimeout(saveTimer); saveTimer = setTimeout(saveSelections, 700); });
    video.addEventListener('timeupdate', () => { if (currentEnd !== null && video.currentTime >= currentEnd - 0.02) { video.pause(); currentEnd = null; } });
    video.addEventListener('error', () => { document.getElementById('now').textContent = `media missing: ${findCandidate(document.querySelector('.row[style*="outline"]')?.dataset.id || '')?.clip || ''}`; });
    loadWorkbench();
  </script>
</body>
</html>
